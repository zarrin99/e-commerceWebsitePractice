<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideShow</title>
    
    <!--fontawesome-->
    <link rel="stylesheet" href="css/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="css/fontawesome/css/brands.css">
    <link rel="stylesheet" href="css/fontawesome/css/regular.css">
    <link rel="stylesheet" href="css/fontawesome/css/solid.css">

    <!--CSS-->
    <link rel="stylesheet" href="css/slideshow.css">
</head>
<body>
    <div class="slideshow-container" >
        <div class="slide fade">
            <img src="images/slide1.jpg" alt="monstera">
        </div>

        <div class="slide fade">
            <img src="images/slide2.jpg" alt="fern">
        </div>

        <div class="slide fade">
            <img src="images/slide3.jpg" alt="calathea">
        </div>

        <!--Navigation-->
        <div class="nav-below">
            <a class="prev" onclick="moveSlide(-1)">
                <i class="fa-solid fa-angle-left"></i>
            </a>
            
            <!--Pause button-->
            <button id="pauseBtn" onclick="togglePause()">◼</button>

            <!--Dots-->
            <div class="dots-container">
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
                
            </div>

            <a class="next" onclick="moveSlide(1)">
                <i class="fa-solid fa-angle-right"></i>
            </a>
        </div>
    </div>

    <script src="slideshow.js" defer></script>
</body>
</html>
