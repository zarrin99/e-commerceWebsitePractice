<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideShow</title>
    
    <!--fontawesome-->
    <link rel="stylesheet" href="css/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="css/fontawesome/css/brands.css">
    <link rel="stylesheet" href="css/fontawesome/css/regular.css">
    <link rel="stylesheet" href="css/fontawesome/css/solid.css">

    <!--CSS-->
    <link rel="stylesheet" href="css/slideshow.css">
</head>
<body>
    <div class="slideshow-container" style="text-align: center;">
        <div class="slide-fade">
            <img src="images/plant1.avif" alt="monstera">
        </div>

        <div class="slide-fade">
            <img src="images/plant2.avif" alt="fern">
        </div>

        <div class="slide-fade">
            <img src="images/plant3.avif" alt="calathea">
        </div>

        <div class="slide-fade">
            <img src="images/plant4.avif" alt="succulent">
        </div>

        <!--Navigation-->
        <a class="prev">
            
        </a>
    </div>

    <script src="slideshow.js"></script>
</body>
</html>
