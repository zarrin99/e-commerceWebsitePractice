<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>

    <!--CSS file-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <!--fontawesome-->
    <link rel="stylesheet" href="css/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="css/fontawesome/css/brands.css">
    <link rel="stylesheet" href="css/fontawesome/css/regular.css">
    <link rel="stylesheet" href="css/fontawesome/css/solid.css">
</head>
<body>
    <!--HEADER-->
    <div id="header-placeholder"></div>

    <main class="centered-paragraph">
        <h2>Thank you so much for supporting my small shop</h2>
        <p>Hope your chosen products make you happy (^-^ゝ</p>

        <div class="cart">
            <h1 class="table-heading">Your cart</h1>
            <span class="table-heading-right"><a href="index.html">Continue Shopping</a></span>

            <table class="cart-table">
                <tr>
                    <th class="product-col">Product</th>
                    <th class="price-col">Price</th>
                    <th class="quantity-col">Quantity</th>
                    <th class="total-col">Total</th>
                </tr>
                <!--generate table dynamically as cart is populated-->
                <div class="cart-table js-cart-table"></div>
            </table>
            <div class="order-instructions">
                <label for="instruction">Order special instruction</label>
                <textarea name="instruction" id=""></textarea>
            </div>

        </div>

    </main>
        
    <!--FOOTER-->
    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
    <script src="loadComponents.js"></script>
</body>
</html>
